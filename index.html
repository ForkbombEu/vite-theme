      THESIS: A live signal marks the project as intentionally unfinished; it refuses the usual centered coming-soon card.
      OWN-WORLD: Pure black and white, pixel-crisp rules, dense bars, oversized mono type, and compact machine metadata.
      STORY: The visitor sees that the project exists, is in progress, and has no claims to make yet.
      FIRST VIEWPORT: A full-screen data field frames one enormous PLACEHOLDER word, with status metadata pinned to opposite corners and the signal line crossing the page.
      FORM: Data-field holding screen, pinned by the brief over seeded direction 320090e9; one restrained scanning line is the signature motion.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <main class="page">
      <header class="masthead" aria-label="Project status">
        <span>PROJECT / 000</span>
        <span class="status"><span class="status__light" aria-hidden="true"></span>IN PROGRESS</span>
      </header>

      <div class="signal" aria-hidden="true"></div>

      <section class="message" aria-labelledby="placeholder-title">
        <p class="message__index">[ 00—00—00 ]</p>
        <h1 id="placeholder-title">Place<wbr />holder</h1>
        <p class="message__note">Something is taking shape here.</p>
      </section>

      <footer class="footer">
        <span>STATUS: TEMPORARY</span>
        <span>© <span id="year"></span></span>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
